<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body>
  <header class="header">
    <h1>Todo App</h1>
    <img class="header__img" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix">
    <a class="header__info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="main">
    <section class="tasks">
      <h2 class="tasks__title tasks__title_add">Add Item</h2>
      <div class="tasks__wrapper">
        <input class="tasks__input tasks__input_add" type="text">
        <button class="tasks__btn tasks__btn_add">Add</button>
      </div>
    </section>
    <section class="tasks">
      <h2 class="tasks__title">Todo</h2>
      <ul class="tasks__list tasks__list_incomplete">
        <li class="task">
          <input class="tasks__input tasks__input_check" type="checkbox">
          <label class="tasks__label">Pay Bills</label>
          <input class="tasks__input tasks__input_edit" type="text">
          <button class="tasks__btn tasks__btn_edit">Edit</button>
          <button class="tasks__btn tasks__btn_delete">
            <img class="tasks__btn-img" src="./remove.svg" alt="Delete Button">
          </button>
        </li>
        <li class="task task__edit-mode">
          <input class="tasks__input tasks__input_check" type="checkbox">
          <label class="tasks__label">Go Shopping</label>
          <input class="tasks__input tasks__input_edit" type="text" value="Go Shopping">
          <button class="tasks__btn tasks__btn_edit">Save</button>
          <button class="tasks__btn tasks__btn_delete">
            <img class="tasks__btn-img" src="./remove.svg" alt="Delete Button">
          </button>
        </li>
      </ul>
    </section>
    <section class="tasks">
      <h2 class="tasks__title">Completed</h2>
      <ul class="tasks__list tasks__list_completed">
        <li class="task">
          <input class="tasks__input tasks__input_check" type="checkbox" checked>
          <label class="tasks__label">See the Doctor</label>
          <input class="tasks__input tasks__input_edit" type="text">
          <button class="tasks__btn tasks__btn_edit">Edit</button>
          <button class="tasks__btn tasks__btn_delete">
            <img class="tasks__btn-img" src="./remove.svg" alt="Delete Button">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
